# machine-monitor — shipped defaults.
#
# This file is part of the repository. Edit it to change what every user of this
# checkout gets, and send a pull request if the change is generally useful.
#
# Do NOT put your own machine's specifics here. Personal settings belong in
#   ~/.config/machine-monitor/config.ini
# which is read after this file and overrides it key by key. Anything you leave
# out of that file keeps the value below, so an override file only ever needs to
# contain the handful of lines you actually want different.

[general]
# Seconds between redraws in live mode (-d).
refresh_seconds = 3
# Window used to measure live CPU. Longer is steadier, shorter is more current.
cpu_sample_seconds = 0.5
# Rows in the TOP CPU and TOP RAM tables.
top_processes = 12

[sections]
# Turn any section off to shorten the dashboard.
vitals = true
thermal = true
attention = true
servers = true
docker = true
top_cpu = true
windowserver = true
top_ram = true

[thresholds]
# Values are percentages unless noted. Below warn renders green, at or above
# warn renders orange, at or above crit renders red.
cpu_warn = 15
cpu_crit = 40
mem_warn = 70
mem_crit = 85
swap_warn = 25
swap_crit = 60
disk_warn = 80
disk_crit = 92
# Degrees Celsius.
temp_warn = 70
temp_crit = 90
# WindowServer CPU% above which the diagnosis section appears.
windowserver_cpu = 15
# A listening dev server older than this many hours is reported as possibly
# forgotten.
stale_server_hours = 24

[power]
# Thermal pressure and power draw come from powermetrics, which needs root.
# Temperature in degrees does not, and is unaffected by this setting.
use_powermetrics = true
powermetrics_timeout = 4

[paths]
# Directories whose subfolders count as projects. A listening socket whose
# working directory sits under one of these is treated as a dev server, which is
# what drives the duplicate-server and stale-server warnings. Comma separated.
project_roots = ~/Projects, ~/Developer, ~/Documents, ~/code, ~/src, ~/dev, ~/work, ~/repos
# Ports to leave out of the SERVERS RUNNING table entirely. Comma separated.
hide_ports =

[port_labels]
# port = label. Exact matches only.
80 = HTTP
443 = HTTPS
1433 = SQL Server
3000 = Node dev
3001 = Node dev
3306 = MySQL
4000 = Dev server
4200 = Angular
5000 = Dev server
5173 = Vite
5353 = mDNS
5432 = PostgreSQL
5433 = PostgreSQL
5672 = RabbitMQ
6379 = Redis
7687 = Neo4j
8000 = HTTP alt
8080 = HTTP alt
8081 = HTTP alt
8888 = Jupyter
9000 = MinIO / PHP-FPM
9001 = MinIO console
9090 = Prometheus
9200 = Elasticsearch
11434 = Ollama
15672 = RabbitMQ UI
24678 = Vite HMR
27017 = MongoDB

[port_ranges]
# low-high = label. Used only when no exact port_labels entry matches.
# Add your own conventions here in your user config rather than this file —
# port numbering schemes are per-team, not universal.
49152-65535 = ephemeral
